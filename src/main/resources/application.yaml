spring:
  application:
    name: schema-based-multi-tenancy-sample
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multiTenancy: SCHEMA
        multi_tenant_connection_provider: com/github/mertdeveci/schemabasedmultitenancysample/infrastructure/multitenancy/SchemaMultiTenantConnectionProvider.java
        tenant_identifier_resolver: com/github/mertdeveci/schemabasedmultitenancysample/infrastructure/multitenancy/TenantIdentifierResolver.java
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
  Jackson:
    default-property-inclusion: non_null
  sql:
    init:
      mode: always
logging:
  level:
    org:
      springframework:
        security: DEBUG
